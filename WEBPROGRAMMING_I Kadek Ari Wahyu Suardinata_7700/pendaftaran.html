<h1 class="judul-pendaftaran">
    PENDAFTARAN KEGIATAN
</h1>
<br>
<br>
<div class="pendaftaran">
    <div class="form-daftar">
        <label for="nama">Nama Lengkap</label>
        <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
    </div>
    <div class="form-daftar">
        <label for="nisn">NISN</label>
        <input type="number" id="nisn" placeholder="Masukkan NISN" required>
    </div>
    <div class="form-daftar">
        <label for="kegiatan">Kegiatan</label>
            <select id="kegiatan" required>
                <option value="">-- pilih kegiatan --</option>
                <option value="Potensi Bisnis & Kecantikan">Potensi Bisnis & Kecantikan</option>
                <option value="Bakat Kreatif & Pelayanan">Bakat Kreatif & Pelayanan</option>
                <option value="Kemah Pramuka & Latihan Kepemimpinan">Kemah Pramuka & Latihan Kepemimpinan</option>
                <option value="Workshop Digital & Public Speaking">Workshop Digital & Public Speaking</option>
                <option value="Classmeeting & Turnamen Olahraga">Classmeeting & Turnamen Olahraga</option>
                <option value="Potensi Digital & IT">Potensi Digital & IT</option>
            </select>
    </div>
    <div class="form-daftar">
    <label for="wa">Nomor WhatsApp</label>
    <input type="tel" id="wa" placeholder="08xxxxxxxxxx" required>
    </div>
    <div class="form-daftar">
        <button class="button-cekpendaftaran" type="button" onclick="pendaftaran()">Daftar</button>
    </div>
</div>
